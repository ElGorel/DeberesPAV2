# Configuracion para trabajar con H2 en memoria

# Configuración de la base de datos (H2 en memoria)
quarkus.datasource.db-kind=h2
# H2 usa por defecto 'sa' y sin contraseña para desarrollo local
quarkus.datasource.username=sa
quarkus.datasource.password=
# 'mem:pa2db' crea la base en RAM; el nombre 'pa2db' es arbitrario
quarkus.datasource.jdbc.url=jdbc:h2:mem:pa2db

# Parámetros recomendados
# Hibernate funcionará igual de bien con H2, generando el esquema automáticamente
quarkus.hibernate-orm.database.generation=update 
#quarkus.hibernate-orm.log.sql=true