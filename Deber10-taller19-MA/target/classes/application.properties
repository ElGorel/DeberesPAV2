# Configuración de la base de datos
#dice que tipo de base de datos se va a usar
quarkus.datasource.db-kind=postgresql
#Usuario con el que se va a conectar a la base de datos
#quarkus.datasource.username=postgres
#Password del usuario con el que se va a conectar a la base de datos
#quarkus.datasource.password=labcom,2015
#URL de conexión a la base de datos
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pa2db

#Parametros recomendable
#Indica que Hibernate debe actualizar el esquema de la base de datos automáticamente según 
#las entidades definidas en el código. Esto es útil durante el desarrollo, ya que permite que 
#los cambios en las entidades se reflejen en la base de datos sin necesidad de realizar migraciones manuales.
quarkus.hibernate-orm.database.generation=update 
#Para mostrar las consultas SQL en la consola
quarkus.hibernate-orm.log.sql=true  
quarkus.hibernate-orm.sql-load-script=import.sql
#quarkus.hibernate-orm.database.generation=drop-and-create
