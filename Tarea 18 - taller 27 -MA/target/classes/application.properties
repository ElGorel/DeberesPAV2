# Configuración de la base de datos (H2 en memoria para ejecución autónoma)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:pa2db;DB_CLOSE_DELAY=-1


#Parametros recomendable
#Indica que Hibernate debe actualizar el esquema de la base de datos automáticamente según 
#las entidades definidas en el código. Esto es útil durante el desarrollo, ya que permite que 
#los cambios en las entidades se reflejen en la base de datos sin necesidad de realizar migraciones manuales.
quarkus.hibernate-orm.database.generation=update 
#Para mostrar las consultas SQL en la consola
quarkus.hibernate-orm.log.sql=true  
